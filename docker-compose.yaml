services:
  # Redis for sessions and Mem0 metadata
  redis:
    image: redis:7-alpine
    container_name: mathteacher_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mathteacher_network

  # Qdrant Vector Database for Mem0
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mathteacher_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - mathteacher_network

volumes:
  redis_data:
  qdrant_data:

networks:
  mathteacher_network:
    driver: bridge